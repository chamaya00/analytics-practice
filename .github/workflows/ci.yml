name: ci

# Thin caller: the logic lives in the factory, at the release pinned below.
#
# The pin is the point. This repository keeps running that exact release until
# somebody bumps the line and merges it - a new release in the factory changes
# nothing here on its own. `/update-agents` proposes the bump as a pull
# request, so the diff gets read here before it runs here.
#
# ---------------------------------------------------------------------------
# Real gate, replacing the provisioning placeholder now that the stack is
# chosen (ADR 0001, docs/decisions/0001-framework-choice.md): Astro, static
# output, npm. `node-version` is pinned to 22 because Astro 7 and Vitest 5
# both require Node >=22.12, above the reusable workflow's default of 20.
# `checks` is left at the default (`typecheck,lint,test,build`), which is
# exactly this repository's four scripts.
#
# `check-name` is pinned explicitly as of v1.34.0. The reusable workflow's own
# default changed there, from the literal string `typecheck, lint, test,
# build` to the generic `checks` - deliberately, so a future repository's
# required check name survives a `checks` list changing under it. This
# repository's branch protection was already pointed at the old default's
# name, so leaving `check-name` unset here would have silently stopped that
# required check reporting the moment this pin moved. Pinning it keeps the
# required check reporting as `ci / typecheck, lint, test, build`, exactly as
# before.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    uses: chamaya00/agent-factory/.github/workflows/ci.yml@v1.34.0
    with:
      node-version: '22'
      check-name: 'typecheck, lint, test, build'

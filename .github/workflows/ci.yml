name: ci

# Thin caller: the logic lives in the factory, at the release pinned below.
#
# The pin is the point. This repository keeps running that exact release until
# somebody bumps the line and merges it - a new release in the factory changes
# nothing here on its own. `/update-agents` proposes the bump as a pull
# request, so the diff gets read here before it runs here.
#
# ---------------------------------------------------------------------------
# Real gate, replacing the provisioning placeholder now that the stack is
# chosen (ADR 0001, docs/decisions/0001-framework-choice.md): Astro, static
# output, npm. `node-version` is pinned to 22 because Astro 7 and Vitest 5
# both require Node >=22.12, above the reusable workflow's default of 20.
# `checks` is left at the default (`typecheck,lint,test,build`), which is
# exactly this repository's four scripts.
#
# `check-name` is the string branch protection matches on, and it is now the
# factory's generic default, `checks`. It used to be the literal
# `typecheck, lint, test, build`, which was this repository's own four scripts
# spelled out - a name that described what the gate ran rather than what the
# gate was. That is the failure mode the generic name exists to prevent: with
# a descriptive name, adding a fifth script or dropping one means renaming the
# required check, and until somebody re-points branch protection the required
# check no longer reports and every merge is blocked - including the pull
# request that would put the name back.
#
# So the name is deliberately a stable identifier for "this repository's
# gate", not a description of it. What the gate currently runs is in the run
# summary, where it is free to change. Protection is pointed at
# `ci / checks` once and never has to move again.
#
# Renaming it back, or to anything else, is a breaking change: the rename and
# the branch-protection update have to happen in one sitting, in that order,
# because the pull request making the change cannot itself satisfy a required
# check it has just renamed away.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    uses: chamaya00/agent-factory/.github/workflows/ci.yml@v1.36.0
    with:
      node-version: '22'
      check-name: 'checks'

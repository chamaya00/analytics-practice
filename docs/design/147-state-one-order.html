<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dontdropthatpromo: Tracker, one live order, beside today</title>
<!-- #147 mock. A drawing made of markup: nothing imports it and it never ships.
     Avatars are real DiceBear avataaars output (see 147-tracker-multi-order-driver-history.md),
     embedded as data: URIs so the file fetches nothing. Photos load by relative path. -->
<style>
  :root { --bg:#fbf7ff; --surface:#f7f1ff; --text:#241b33; --muted:#6b5d85; --border:#e3d6fa;
    --accent:#6c3ce0; --accent-b:#ff7a45; --tint:#ede1ff; --on-accent:#fbf7ff;
    --font: system-ui, 'Segoe UI Semibold', 'Helvetica Neue Condensed', 'Arial Narrow', Arial, sans-serif; }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font); font-size: 0.9375rem; line-height: 1.4; color: var(--text); background: var(--bg); }
  img { display: block; }
  .site-header { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 1.25rem; min-height: 2.5rem; }
  .wordmark { margin: 0; font-size: 0.9375rem; font-weight: 500; line-height: 1.2; }
  .wordmark b { font-weight: 800; }
  .wordmark .tail { position: relative; }
  .wordmark .tail::after { content: ''; position: absolute; right: -3px; bottom: -2px; width: 6px; height: 6px; border-bottom: 2px solid var(--accent); border-right: 2px solid var(--accent); border-radius: 0 0 6px 0; }
  .site-nav { display: none; gap: 0.875rem; }
  .site-nav a { color: var(--text); text-decoration: none; }
  .site-nav a.current { text-decoration: underline; }
  main { max-width: 26rem; margin: 0 auto; padding: 0.875rem 1.25rem calc(56px + 1.75rem); }
  h1 { font-size: 1rem; font-weight: 800; margin: 0 0 0.875rem; }
  .section-label { display: flex; align-items: baseline; gap: 0.5rem; margin: 0 0 0.5rem; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .section-label .count { letter-spacing: 0; }

  /* the open order card */
  .order-card { background: var(--surface); border-radius: 16px; padding: 0.875rem 0.875rem 0.875rem; margin-bottom: 0.5rem; }
  .card-head { display: flex; gap: 0.625rem; align-items: center; }
  .thumb { flex: none; width: 44px; height: 44px; border-radius: 10px; object-fit: cover; }
  .card-head .name { font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; }
  .meta { font-size: 0.75rem; color: var(--muted); }
  .countdown { display: flex; align-items: center; gap: 0.5rem; margin: 0.75rem 0 0.125rem; }
  .countdown .vehicle { width: 26px; height: 26px; flex: none; }
  .countdown .big { font-size: 2.25rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
  .countdown-sub { font-size: 0.75rem; color: var(--muted); margin: 0 0 0.625rem; }
  .delivered-line { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; margin: 0.75rem 0 0.625rem; }

  .stepper { list-style: none; margin: 0 0 0.75rem; padding: 0; }
  .stepper li { display: flex; gap: 0.75rem; }
  .rail { flex: none; width: 18px; display: flex; flex-direction: column; align-items: center; }
  .dot { flex: none; width: 18px; height: 18px; border-radius: 999px; background: var(--bg); border: 2px solid var(--border); color: var(--on-accent); display: flex; align-items: center; justify-content: center; }
  .dot svg { width: 11px; height: 11px; }
  .line { flex: 1; width: 2px; min-height: 10px; background: var(--border); }
  .stepper li:last-child .line { display: none; }
  .step-label { padding: 0 0 0.5rem; color: var(--muted); line-height: 18px; }
  .stepper li:last-child .step-label { padding-bottom: 0; }
  .stepper li.done .dot { background: var(--accent); border-color: var(--accent); }
  .stepper li.current .dot { background: var(--accent-b); border-color: var(--accent-b); }
  .stepper li.done .line { background: var(--accent); }
  .stepper li.done .step-label, .stepper li.current .step-label { color: var(--text); font-weight: 700; }

  /* driver slot: same height whether a driver is assigned or not */
  .driver { display: flex; align-items: center; gap: 0.75rem; background: var(--tint); border-radius: 12px; padding: 0 0.75rem 0 0.5rem; min-height: 60px; margin-top: 1.25rem; }
  .driver .avatar { flex: none; width: 68px; height: 68px; margin-top: -20px; align-self: flex-end; }
  .driver .who { padding: 0.5rem 0; min-width: 0; }
  .driver .kicker { font-size: 0.75rem; color: var(--muted); }
  .driver .dname { font-weight: 800; font-size: 1rem; line-height: 1.2; }
  .rating { font-size: 0.75rem; color: var(--text); font-weight: 700; }
  .rating .n { color: var(--muted); font-weight: 400; }
  .driver .vehicle-tag { margin-left: auto; color: var(--muted); display: flex; }
  .driver .vehicle-tag svg { width: 22px; height: 22px; }
  .driver.pending .placeholder { flex: none; width: 48px; height: 48px; margin: 6px 10px 6px 6px; border-radius: 999px; border: 2px dashed var(--muted); color: var(--muted); display: flex; align-items: center; justify-content: center; }
  .driver.pending .placeholder svg { width: 22px; height: 22px; }
  .driver.pending .dname { font-weight: 700; font-size: 0.9375rem; }

  /* a collapsed live order: the switcher */
  .order-row { width: 100%; display: flex; align-items: center; gap: 0.625rem; text-align: left; font: inherit; color: inherit; background: var(--surface); border: none; border-radius: 14px; padding: 0.625rem 0.75rem 0.625rem 0.625rem; margin-bottom: 0.5rem; min-height: 60px; }
  .order-row .thumb { width: 40px; height: 40px; }
  .order-row .mid { flex: 1; min-width: 0; }
  .order-row .name { font-weight: 700; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .order-row .status { font-size: 0.75rem; color: var(--muted); display: flex; align-items: center; gap: 0.25rem; }
  .order-row .status img { width: 20px; height: 20px; }
  .order-row .status b { color: var(--text); }
  .order-row .eta { flex: none; text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; }
  .order-row .eta .u { display: block; font-size: 0.75rem; font-weight: 400; color: var(--muted); }
  .order-row .chev { flex: none; width: 18px; height: 18px; color: var(--muted); }

  /* history */
  .past { margin-top: 1.75rem; }
  .history { list-style: none; margin: 0; padding: 0 0.75rem; background: var(--surface); border-radius: 16px; }
  .history li { display: flex; gap: 0.625rem; padding: 0.75rem 0; border-top: 1px solid var(--border); }
  .history li:first-child { border-top: none; }
  .history .thumb { width: 40px; height: 40px; border-radius: 8px; }
  .history .mid { flex: 1; min-width: 0; }
  .history .name { font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .history .by { display: flex; align-items: center; gap: 0.25rem; font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
  .history .by img { width: 20px; height: 20px; }
  .history .right { flex: none; text-align: right; }
  .history .total { font-weight: 700; font-variant-numeric: tabular-nums; }
  .history .total .sub { display: block; font-size: 0.75rem; font-weight: 400; color: var(--muted); }
  .history .state { display: inline-flex; align-items: center; gap: 3px; font-size: 0.75rem; color: var(--muted); }
  .history .state svg { width: 12px; height: 12px; color: var(--muted); }
  .device-note { font-size: 0.75rem; color: var(--muted); margin: 0.5rem 0.25rem 0; }

  .empty { text-align: center; padding: 2.5rem 0 1rem; }
  .empty p { margin: 0 0 0.875rem; }
  .add-button { display: inline-flex; align-items: center; min-height: 44px; padding: 0.5rem 0.875rem; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 10px; text-decoration: none; }
  .disclosure { margin: 0.75rem 0; padding: 0.25rem 0.75rem; background: var(--bg); border-radius: 10px; font-size: 0.75rem; display: flex; gap: 0.25rem; align-items: flex-start; }
  .disclosure .icon { flex: none; margin-top: 2px; }
  .disclosure a { color: var(--accent); font-weight: 700; text-decoration: none; }
  .rate h2 { font-size: 1rem; font-weight: 700; margin: 0.25rem 0 0.25rem; }
  .stars { display: flex; gap: 0.25rem; margin-bottom: 0.5rem; }
  .stars svg { width: 36px; height: 36px; fill: var(--border); }
  .stars svg.on { fill: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 0.25rem; margin-bottom: 0.75rem; }
  .chip { min-height: 32px; display: inline-flex; align-items: center; padding: 0 0.5rem; border-radius: 999px; border: 1px solid var(--border); background: var(--bg); font-size: 0.75rem; font-weight: 600; }
  .chip.on { border-color: var(--accent); color: var(--accent); font-weight: 800; }
  .submit { width: 100%; min-height: 48px; border: none; border-radius: 12px; background: var(--accent); color: var(--on-accent); font: inherit; font-weight: 800; }

  .scaffold { border: 1px dashed var(--border); border-radius: 8px; padding: 0.25rem 0.5rem; margin: 0 0 0.75rem; font-size: 0.6875rem; color: var(--muted); }
  .scaffold b { color: var(--text); }

  .tab-bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: var(--surface); border-top: 1px solid var(--border); z-index: 5; }
  .tab-bar a { flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 0.75rem; color: var(--muted); text-decoration: none; }
  .tab-bar svg { width: 20px; height: 20px; }
  .tab-bar a.current { color: var(--text); font-weight: 700; }
  .tab-bar a.current .tab-label { background: var(--tint); padding: 1px 0.875rem; border-radius: 999px; }

  @media (min-width: 481px) {
    .tab-bar { display: none; }
    .site-header { border-bottom: 1px solid var(--border); padding: 0.75rem 2rem; }
    .site-nav { display: flex; }
    main { max-width: 62rem; padding: 1.75rem 2rem 2.5rem; }
    h1 { font-size: 1rem; }
    .cols { display: grid; grid-template-columns: minmax(0, 25rem) minmax(0, 1fr); gap: 2.5rem; align-items: start; }
    .past { margin-top: 0; }
    .narrow-only { display: none; }
  }
  @media (max-width: 480px) {
    .wide-only { display: none; }
    .scrolled-away { display: none; }
  }</style>
</head>
